# Deploy blueprint for Render (https://render.com). It is optional: the same settings can be typed
# into the Render dashboard by hand (see the README).
services:
  - type: web
    name: revisiontrack
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # seed.py resets the database to the dummy data, because the free host's disk is wiped on restart.
    # One worker keeps the in-memory rate limit counters in one place.
    startCommand: python seed.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: BEHIND_PROXY
        value: "1"
      - key: CORS_ORIGINS
        value: ""
